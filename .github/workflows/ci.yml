name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Fails the build on a known high or critical vulnerability in anything that ships (dev tools are covered by
      # Dependabot alerts instead, since they never reach the image).
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      # No API keys needed: the tests use a fake Nemotron transport, so CI never spends Token Factory credit.
      - name: Backend tests
        run: npm test

      - name: Build frontend + jar
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only (no push), so a broken Dockerfile is caught before a Nebius deploy.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
