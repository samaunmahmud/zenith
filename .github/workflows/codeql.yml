name: CodeQL

# Static analysis of the Java backend and the TypeScript frontend for security bugs (injection, XSS, path
# traversal, unsafe deserialisation, ...). Results appear under the repository's Security tab.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
          queries: security-extended

      - name: Build backend
        if: matrix.language == 'java-kotlin'
        run: cd backend && mvn -q -B compile -DskipTests

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
