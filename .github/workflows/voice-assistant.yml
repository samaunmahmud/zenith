name: Voice assistant

on:
  push:
    branches: [main]
    paths:
      - 'voice-assistant/**'
      - '.github/workflows/voice-assistant.yml'
  pull_request:
    paths:
      - 'voice-assistant/**'
      - '.github/workflows/voice-assistant.yml'

permissions:
  contents: read

concurrency:
  group: voice-assistant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the extra integration tests against real osascript, AppKit and /Applications.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: voice-assistant
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: voice-assistant/requirements*.txt

      - run: pip install -r requirements-dev.txt

      # No API keys needed: Gemini and the Mac are faked in the unit tests.
      - run: python -m pytest -v
